# 模拟成交回测：Replay + Simple_Strategy + Risk + CoreState + SimTrade
# 运行：./bin/hft_engine conf/config_sim_backtest.yaml

symbols_file: ../conf/symbols.txt

snapshot:
  type: local

plugins:
  - name: Replay
    library: libmod_replay.so
    enabled: true
    config:
      data_file: data/market_data_20260320
      debug: false

  - name: Simple_Strategy
    library: libmod_strategy.so
    enabled: true
    config:
      symbol: au2606
      buy_thresh: "1048"
      sell_thresh: "1050"

  - name: Risk
    library: libmod_risk.so
    enabled: true
    config:
      max_orders_per_second: 100

  - name: SimTrade
    library: libmod_sim_trade.so
    enabled: true
    config:
      debug: true
      slippage_ticks: "0.01"
      tick_size: "1"
      initial_balance: "1000000"
